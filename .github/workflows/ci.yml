name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cd core && cargo test --workspace

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt + clippy
        run: cd core && cargo fmt --check && cargo clippy --workspace -- -D warnings

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: analyze + test
        run: cd app && flutter pub get && flutter analyze && flutter test

  # frb 生成物已提交入库（engineering.md 第 3 节），CI 无需 codegen；
  # cargokit 会自动安装所需 NDK（M1 实测）。
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: build debug apk
        run: cd app && flutter pub get && flutter build apk --debug

  # build-ios：macOS runner（暂无签名证书，先验证工具链；签名见 release-checklist.md）
