[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/storage",
    "crates/crypto",
    "crates/sync",
    "crates/context",
    "crates/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
